<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scale Lab — system design you can watch</title>
    <meta name="description" content="Interactive system design lessons: animated isometric diagrams you step through." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the theme before first paint so dark mode never flashes light.
      try {
        var saved = JSON.parse(localStorage.getItem('stl:theme'));
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
